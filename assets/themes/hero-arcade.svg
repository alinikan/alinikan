<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc">
<title id="title">ALI.OS — arcade theme</title>
<desc id="desc">Cinematic sci-fi command center banner with an orbital hub, terminal boot sequence, and violet cyan star field.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#140A22"/><stop offset=".57" stop-color="#351240"/><stop offset="1" stop-color="#16132B"/></linearGradient>
  <linearGradient id="line" x2="1"><stop stop-color="#FB7185"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
  <radialGradient id="planet"><stop stop-color="#EEE8FF"/><stop offset=".22" stop-color="#FB7185"/><stop offset=".7" stop-color="#C026D3"/><stop offset="1" stop-color="#212F63"/></radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="9"/></filter>
  <clipPath id="panel"><rect x="0" y="0" width="1000" height="320" rx="22"/></clipPath>
</defs>
<style>
  .blink{animation:blink 1.2s steps(1,end) infinite}
  .orbit{animation:orbit 24s linear infinite;transform-origin:812px 155px}
  .pulse{animation:pulse 3.5s ease-in-out infinite}
  .boot1{opacity:0;animation:appear 8s steps(1,end) infinite}
  .boot2{opacity:0;animation:appear 8s steps(1,end) infinite 1.1s}
  .boot3{opacity:0;animation:appear 8s steps(1,end) infinite 2.2s}
  .scan{animation:scan 7s linear infinite}
  @keyframes orbit{to{transform:rotate(360deg)}}
  @keyframes blink{50%{opacity:0}}
  @keyframes pulse{50%{opacity:.35}}
  @keyframes appear{0%{opacity:0}10%,100%{opacity:1}}
  @keyframes scan{0%{transform:translateY(-270px)}100%{transform:translateY(350px)}}
  @media(prefers-reduced-motion:reduce){.orbit,.pulse,.blink,.boot1,.boot2,.boot3,.scan{animation:none;opacity:1}.scan{display:none}}
</style>
