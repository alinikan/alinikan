name: "📡 Visitor transmission"
description: "Leave a friendly message for the ALI.OS guestbook. Messages are reviewed before appearing on the companion site."
title: "[Transmission] "
labels: ["guestbook-pending"]
body:
  - type: markdown
    attributes:
      value: |
        **Welcome to ALI.OS.** Public transmissions are hosted as GitHub issues.
        Ali may approve suitable entries by adding the `guestbook-approved` label.
        Please do not share private information, phone numbers, or personal contact details.
  - type: input
    id: callsign
    attributes:
      label: Your callsign
      description: "A nickname or GitHub handle is fine."
      placeholder: "CosmicVisitor"
    validations:
      required: true
  - type: textarea
    id: transmission
    attributes:
      label: Your message
      description: "Keep it friendly and related to the projects or developer universe."
      placeholder: "Just explored your project constellation..."
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Guestbook visibility
      options:
        - label: "I understand this GitHub issue is public and may appear on the guestbook after moderation."
          required: true
