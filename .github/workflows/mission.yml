name: Refresh ALI.OS public mission signals

on:
  push:
    branches: [feature/ali-os-sci-fi-arcade-redesign]
    paths: ['.github/workflows/mission.yml']
  workflow_dispatch:
  schedule:
    - cron: "31 9 * * 1,5"

permissions:
  contents: write

concurrency:
  group: ali-os-mission
  cancel-in-progress: false

jobs:
  mission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Generate actual public repository telemetry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-mission.mjs
      - name: Commit updated mission and XP cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/mission.svg generated/developer-xp.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh public mission signals and XP [skip ci]"
            git push
          fi
