name: Refresh 3D contribution skyline

on:
  push:
    branches: [feature/ali-os-sci-fi-arcade-redesign]
    paths: ['.github/workflows/profile-3d.yml']
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * 6"

permissions:
  contents: write

concurrency:
  group: ali-os-3d
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Generate 3D graph
        uses: yoshi389111/github-profile-3d-contrib@e235d118909be71eb7edb05482a3de4e76156df3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh 3D contributions [skip ci]"
            git push
          fi
