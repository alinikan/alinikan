name: Refresh ALI.OS telemetry

on:
  push:
    branches: [feature/ali-os-sci-fi-arcade-redesign]
    paths: ['.github/workflows/telemetry.yml']
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 2,5"

permissions:
  contents: write

concurrency:
  group: ali-os-telemetry
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Generate GitHub overview
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          options: 'username=alinikan&show_icons=true&hide_rank=true&theme=tokyonight&include_all_commits=true'
          path: generated/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true
      - name: Generate language map
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: top-langs
          options: 'username=alinikan&layout=compact&langs_count=8&hide=Jupyter%20Notebook&theme=tokyonight'
          path: generated/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true
      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/stats.svg generated/languages.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh ALI.OS statistics [skip ci]"
            git push
          fi
