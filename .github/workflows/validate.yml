name: Validate ALI.OS draft

on:
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - "site/**"
      - "assets/**"
      - "generated/**"
      - "profile-3d-contrib/**"
      - "scripts/**"
      - "docs/**"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check JavaScript syntax
        run: |
          node --check site/app.js
          node --check scripts/update-mission.mjs
      - name: Validate every SVG, local README link, and feature inventory
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          root = Path.cwd()
          svgs = list(Path('assets').rglob('*.svg')) + list(Path('generated').rglob('*.svg')) + list(Path('profile-3d-contrib').rglob('*.svg'))
          assert svgs, 'No SVG assets found'
          for f in svgs:
              ET.parse(f)
          readme = Path('README.md').read_text(encoding='utf-8')
          for name in ['Pac-Man','Galaga','Breakout','Snake','Tetris','Bomberman','Minesweeper','Puzzle Bobble']:
              assert name in readme, f'Missing arcade game: {name}'
          assert 'github-readme-stats.vercel.app' not in readme, 'Broken old stats endpoint still referenced'
          for forbidden in ['OpenAI API','Last.fm','Spotify','now-playing','api/ask','alios-ai-endpoint']:
              assert forbidden.lower() not in readme.lower(), f'Removed third-party dependency still in README: {forbidden}'
          for removed in ['site/api/ask.js','site/now-playing.json','scripts/update-lastfm.mjs','.github/workflows/now-playing.yml','generated/now-playing.svg']:
              assert not Path(removed).exists(), f'Removed paid/music integration still tracked: {removed}'
          for page in ['site/index.html','site/app.js','site/README.md','docs/INTEGRATIONS.md','docs/LAUNCH_CHECKLIST.md']:
              content = Path(page).read_text(encoding='utf-8').lower()
              for forbidden in ['openai_api_key','lastfm_','alios-ai-endpoint','now-playing','last.fm','spotify']:
                  assert forbidden not in content, f'{page} retains removed integration: {forbidden}'
          refs = re.findall(r'(?:src|srcset)="(\./[^"]+)"', readme)
          refs += re.findall(r'\]\((\./[^)]+)\)', readme)
          for link in refs:
              resolved = root / link.removeprefix('./')
              assert resolved.is_file(), f'Broken local README link: {link}'
          for name in ['site/index.html','site/styles.css','site/app.js','scripts/update-mission.mjs','generated/mission.svg','generated/developer-xp.svg','.github/ISSUE_TEMPLATE/guestbook.yml','docs/INTEGRATIONS.md']:
              assert Path(name).is_file(), f'Missing expected file: {name}'
          print(f'Validated {len(svgs)} SVGs, {len(refs)} local links, and required features')
          PY

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install test-only dependencies
        working-directory: site
        run: npm install --no-audit --no-fund --ignore-scripts --package-lock=false
      - name: Install headless Chromium
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Test interactive portal on desktop and mobile
        working-directory: site
        run: npm run test:e2e
      - name: Upload desktop/mobile screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alios-portal-preview-and-tests
          path: |
            site/screenshots/
            site/playwright-report/
            site/test-results/
          if-no-files-found: ignore
          retention-days: 7
