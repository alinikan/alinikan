name: ALI.OS arcade contribution games

on:
  push:
    branches: [feature/ali-os-sci-fi-arcade-redesign]
    paths: ['.github/workflows/arcade.yml']
  workflow_dispatch:
  schedule:
    - cron: "39 8 * * 3"

permissions:
  contents: write

concurrency:
  group: ali-os-arcade
  cancel-in-progress: false

jobs:
  arcade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Generate eight arcade contribution games
        uses: abozanona/pacman-contribution-graph@294c47eff28a41339a279107ae771b5fa020037a
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman,galaga,breakout,snake,tetris,bomberman,minesweeper,puzzle-bobble'
      - name: Verify and save generated arcade images
        run: |
          set -euo pipefail
          for game in pacman galaga breakout snake tetris bomberman minesweeper puzzle-bobble; do
            test -s "dist/${game}-contribution-graph.svg"
            test -s "dist/${game}-contribution-graph-dark.svg"
          done
          mkdir -p generated/arcade
          cp dist/*-contribution-graph*.svg generated/arcade/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/arcade/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh eight arcade contribution games [skip ci]"
            git push
          fi
