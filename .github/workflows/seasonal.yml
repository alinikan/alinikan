name: Rotate ALI.OS seasonal themes

on:
  workflow_dispatch:
    inputs:
      theme:
        description: "Choose a theme, or auto for current month"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - nebula
          - winter
          - arcade
  schedule:
    - cron: "13 9 1 * *"

permissions:
  contents: write

concurrency:
  group: ali-os-season
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Choose and apply theme
        env:
          THEME_INPUT: ${{ inputs.theme || 'auto' }}
        run: |
          set -euo pipefail
          theme="$THEME_INPUT"
          if [[ "$theme" == auto ]]; then
            case "$(date -u +%m)" in
              12|01|02) theme=winter ;;
              10) theme=arcade ;;
              *) theme=nebula ;;
            esac
          fi
          case "$theme" in nebula|winter|arcade) ;; *) exit 1 ;; esac
          cp "assets/themes/hero-$theme.svg" assets/hero.svg
          printf 'ALI.OS theme: %s\n' "$theme"
      - name: Commit new theme only if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero.svg
          if ! git diff --cached --quiet; then
            git commit -m "design: rotate ALI.OS seasonal palette [skip ci]"
            git push
          fi
